spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@example.com
    password: test-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

custom:
  jwt:
    access:
      secret: test-access-secret-key-must-be-at-least-32-characters-long
      expiration: 1800000
      cookie-name: access-token
    refresh:
      secret: test-refresh-secret-key-must-be-at-least-32-characters-long
      expiration: 604800000
      cookie-name: refresh-token
  cookie:
    domain: localhost
    secure: false
    same-site: Lax

  aws:
    bucket: test-bucket
    region: ap-northeast-2

  password-reset:
    token-ttl: 1800000
    rate-limit-window: 300000
    rate-limit-max: 3
  front:
    base-url: https://app.example.com


groq:
  api-key: test-groq-api-key
  model: llama-3.3-70b-versatile

app:
  cors:
    allowed-origins:
    - http://localhost:3000
