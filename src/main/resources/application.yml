spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway가 스키마를 관리하므로 create/update 사용 금지
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

groq:
  api-key: ${GROQ_API_KEY}
  model: llama-3.3-70b-versatile

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URI}                        # /api/v1/auth/github/callback
  connect-client-id: ${GITHUB_CONNECT_CLIENT_ID}
  connect-client-secret: ${GITHUB_CONNECT_CLIENT_SECRET}
  connect-redirect-uri: ${GITHUB_CONNECT_REDIRECT_URI}        # /api/v1/members/me/github/connect/callback
  front-redirect-uri: ${GITHUB_FRONT_REDIRECT_URI}            # 연결 완료 후 프론트 redirect base URL
  token: ${GITHUB_TOKEN}                                      # Issue 생성용 PAT (필요 scope: repo)

custom:
  jwt:
    access:
      secret: ${JWT_ACCESS_SECRET}
      expiration: 1800000 # 30분
      cookie-name: access-token
    refresh:
      secret: ${JWT_REFRESH_SECRET}
      expiration: 604800000 # 7일
      cookie-name: refresh-token
  cookie:
    domain: ${COOKIE_DOMAIN:localhost}
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  aws:
    bucket: ${BUCKET_NAME}
    region: ${REGION}

app:
  cors:
    allowed-origins:
    - ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
springdoc:
  swagger-ui:
    disable-swagger-default-url=true
