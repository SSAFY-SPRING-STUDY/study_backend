spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway가 스키마를 관리하므로 create/update 사용 금지
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

groq:
  api-key: ${GROQ_API_KEY}
  model: llama-3.3-70b-versatile

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URI}                        # /api/v1/auth/github/callback
  connect-redirect-uri: ${GITHUB_CONNECT_REDIRECT_URI}        # /api/v1/members/me/github/connect/callback

custom:
  jwt:
    access:
      secret: ${JWT_ACCESS_SECRET}
      expiration: 1800000 # 30분
      cookie-name: access-token
    refresh:
      secret: ${JWT_REFRESH_SECRET}
      expiration: 604800000 # 7일
      cookie-name: refresh-token
  cookie:
    domain: ${COOKIE_DOMAIN:localhost}
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  aws:
    bucket: ${BUCKET_NAME}
    region: ${REGION}
  password-reset:
    token-ttl: 1800000          # 30분 (ms)
    rate-limit-window: 300000   # 5분 (ms)
    rate-limit-max: 3
  front:
    base-url: ${FRONT_BASE_URL}   # 프론트엔드 base URL (예: http://localhost:3000)

app:
  cors:
    allowed-origins:
    - ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
springdoc:
  swagger-ui:
    disable-swagger-default-url=true

# Actuator: health 만 외부 노출 + mail health 비활성화.
# MailHealthIndicator 가 매 health 체크마다 SMTP 핑을 시도하여 톰캣 thread 를
# 잡아먹고 (75 초 timeout 사례 관측), Hikari thread starvation 까지 유발했었다.
# 실제 메일 발송 동작과 무관하게 health 핑만 끈다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
